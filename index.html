<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Buttonfly</title>
        <style>
            .fullwindow {
                position: absolute;
                top: 0px;
                left: 0px;
                margin: 0px;
                border: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                display: block;
            }
        </style>
    </head>
    <body style="background-color: #000000;">
        <canvas class = "fullwindow" id="canvas" oncontextmenu="event.preventDefault()"/>
        <script type="text/javascript">
            var Module = {};
            Module.canvas = document.getElementById('canvas');
            var demoBase = 'https://sgi-demos.org/sgi-demos/demos/buttonfly/web/';
            Module.locateFile = function (path) { return demoBase + path; };
        </script>
        <script async type="text/javascript" src="https://sgi-demos.org/sgi-demos/demos/buttonfly/web/buttonfly.js"></script>
        <script defer src="https://sgi-demos.org/sgi-demos/demos/placard.js" data-demo="buttonfly"></script>
    </body>
</html>
