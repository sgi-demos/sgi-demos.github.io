<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGI demos</title>
    <style>
        /* Palette: SGI O2 case dark blue for the background, with the cards,
           borders, and muted text tinted to match. */
        :root {
            --bg: #1a2a4a;
            --card: #223053;
            --card-hover: #273257;
            --line: #314868;
            --text: #ffffff;
            --muted: #a3b3c9;
            --link: #8fc3ea;
            --link-hover: #b9dcf5;
        }

        * { box-sizing: border-box; }

        html { -webkit-text-size-adjust: 100%; }

        body {
            margin: 0;
            padding: 1.5rem 1.5rem 5rem;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .page { max-width: 1240px; margin: 0 auto; }

        header { margin-bottom: 1.5rem; }

        h1 {
            margin: 0 0 0.6rem;
            font-size: 1.7rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 1.0rem;
        }

        header a { color: var(--link); text-decoration: none; }
        header a:hover { color: var(--link-hover); text-decoration: underline; }

        /* Dynamically resizable grid: cards reflow to fill the width */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
        }

        .card {
            display: flex;
            flex-direction: column;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 8px;
            overflow: hidden;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .card:hover { background: var(--card-hover); transform: translateY(-2px); }

        .thumb-link { display: block; }

        .thumb {
            display: block;
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            background: #132239;
            border-bottom: 1px solid var(--line);
        }

        .card-body {
            padding: 0.7rem 0.85rem 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
            flex: 1;
        }

        .card-title {
            font-size: 0.92rem;
            font-weight: 600;
            font-style: italic;
            line-height: 1.3;
        }

        .card-sub {
            margin-top: -0.35rem;
            color: var(--muted);
            font-size: 0.8rem;
            line-height: 1.3;
        }

        .links {
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem 0.9rem;
            font-size: 0.85rem;
        }

        .links a {
            color: var(--text);
            text-decoration: none;
        }
        .links a:hover { text-decoration: underline; }

        hr {
            border: none;
            border-top: 1px solid var(--line);
            margin: 3.5rem 0 0;
        }

        a:focus-visible, .card:focus-within {
            outline: 2px solid var(--link);
            outline-offset: 2px;
        }

        @media (prefers-reduced-motion: reduce) {
            .card { transition: none; }
            .card:hover { transform: none; }
        }
    </style>
</head>
<body>
<div class="page">
    <header>
        <h1><i>SGI demos from long ago, running in your browser today</i></h1>
        <p>
            Original SGI demos, compiled for the web with Emscripten.
            Click thumbnails to run, or use <a href="../">Buttonfly</a> for a more authentic experience.
            See the <a href="https://github.com/sgi-demos/sgi-demos#readme">README</a>
            and <a href="https://github.com/sgi-demos/sgi-demos">source</a>.
        </p>
    </header>

    <div class="grid" id="grid"></div>

    <hr>
</div>

<script>
    // Each demo's web build lives at <SITE>/sgi-demos/demos/<name>/web/ (the
    // sgi-demos repo's own Pages site, served under /sgi-demos/); its source
    // is demos/<name> in that repo. Thumbnails are media/<name>.png there,
    // generated by scripts/thumbs.mjs. The media URL is absolute so the
    // thumbnails also load when previewing this page outside the site.
    // Demos from other sgi-demos repos (each its own Pages site under
    // <SITE>/<repo>/) set run, source, and thumb explicitly on their entry.
    const WEB = "../sgi-demos/demos";
    const SOURCE = "https://github.com/sgi-demos/sgi-demos/tree/main/demos";
    const MEDIA = "https://sgi-demos.org/sgi-demos/media";

    const demos = [
        { name: "arena",                title: "Arena" },
        { name: "bounce",               title: "Bounce" },
        { name: "buttonfly",            title: "Buttonfly",                               sub: "Wade Olsen" },
        { name: "cedit",                title: "Cedit",                                   sub: "Paul Haeberli, 1984" },
        { name: "ep-1988",              title: "Electropaint 1988",                       sub: "David Tristram, 1988" },
        { name: "ep-1989",              title: "Electropaint 1989",                       sub: "David Tristram, 1989" },
        { name: "ep-1994-ogl-decomp",   title: "Electropaint 1994 (OpenGL, decompiled)",  sub: "David Tristram, 1994" },
        { name: "ep-1994-ogl-reversed", title: "Electropaint 1994 (OpenGL, reversed)",    sub: "David Tristram, 1994" },
        { name: "flight-1988",          title: "Flight 1988",                             sub: "Gary Tarolli, 1988" },
        { name: "flight-1994",          title: "Flight 1994",                             sub: "Rob Mace, 1994" },
        { name: "gview",                title: "Gview (Barcelona)",                       sub: "Late 1980s" },
        { name: "ideas",                title: "Ideas" },
        { name: "insect",               title: "Insect",                                  sub: "Thant Tessman, mid-1980s" },
        { name: "jello",                title: "Jello",                                   sub: "Thant Tessman, 1987" },
        { name: "logo",                 title: "Logo",                                    sub: "Thant Tessman, 1987" },
        { name: "newave",               title: "Newave",                                  sub: "Late 1980s" },
        { name: "webfly",               title: "Performer Town",                          sub: "SGI perfly",
          run: "../sgi-performer/web/apps/webfly/web/",
          source: "https://github.com/sgi-demos/sgi-performer/tree/main/web/apps/webfly",
          thumb: "https://sgi-demos.org/sgi-performer/media/webfly.png" },
        { name: "twilight",             title: "Twilight",                                sub: "Howard Look, 1991" },
    ];

    function makeCard({ name, title, sub, run, source, thumb }) {
        run = run || `${WEB}/${name}/web/`;
        source = source || `${SOURCE}/${name}`;
        thumb = thumb || `${MEDIA}/${name}.png`;

        const card = document.createElement("div");
        card.className = "card";

        // Thumbnail links to the demo, same as the "run" link.
        const img = document.createElement("img");
        img.className = "thumb";
        img.src = thumb;
        img.alt = title;
        img.loading = "lazy";

        const thumbLink = document.createElement("a");
        thumbLink.className = "thumb-link";
        thumbLink.href = run;
        thumbLink.appendChild(img);
        card.appendChild(thumbLink);

        const body = document.createElement("div");
        body.className = "card-body";

        const t = document.createElement("div");
        t.className = "card-title";
        t.textContent = title;
        body.appendChild(t);

        if (sub) {
            const s = document.createElement("div");
            s.className = "card-sub";
            s.textContent = sub;
            body.appendChild(s);
        }

        const row = document.createElement("div");
        row.className = "links";
        for (const { label, href } of [
            { label: "run",    href: run },
            { label: "source", href: source },
        ]) {
            const a = document.createElement("a");
            a.href = href;
            a.textContent = label;
            row.appendChild(a);
        }
        body.appendChild(row);

        card.appendChild(body);
        return card;
    }

    const grid = document.getElementById("grid");
    demos.forEach(d => grid.appendChild(makeCard(d)));
</script>
</body>
</html>
